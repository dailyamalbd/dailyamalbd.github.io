<style>

.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
select,.btn{font-family:inherit;font-size:15px;background:var(--gl);color:var(--ink);border:0;border-radius:10px;padding:8px 12px}

.gl{display:flex;justify-content:space-between;margin:14px 0}

.chip{font-size:15px;font-weight:600}

  var ra=fh(atan2(cos(e)*sin(L),cos(L))/15);return{decl:asin(sin(e)*sin(L)),eq:q/15-ra}}
function jdOf(y,m,d){if(m<=2){y--;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function times(y,m,d,lat,lon){

  return{fajr:at(18,1),sunrise:at(.833,1),dhuhr:noon+2/60,asr:at(asrAng,0),sunset:at(.833,0),maghrib:at(.833,0)+1/60,isha:at(18,0)}}

function week(){

VERSES.push(["সূরা বাকারা ২:৪৫ (অংশ)", "وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ", "তোমরা ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো।"],
["সূরা বাকারা ২:১৮৬ (অংশ)", "وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ", "আমার বান্দারা যখন আপনাকে আমার সম্পর্কে জিজ্ঞাসা করে, (বলুন) আমি তো নিকটেই। আহ্বানকারী যখন আমাকে ডাকে, আমি তার ডাকে সাড়া দিই।"],
["সূরা বাকারা ২:২২২ (অংশ)", "إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ", "নিশ্চয়ই আল্লাহ তাওবাকারীদের ভালোবাসেন এবং পবিত্রতা অর্জনকারীদের ভালোবাসেন।"],
["সূরা আলে ইমরান ৩:৩১ (অংশ)", "قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ", "বলুন, যদি তোমরা আল্লাহকে ভালোবাসো, তবে আমাকে অনুসরণ করো; আল্লাহ তোমাদের ভালোবাসবেন এবং তোমাদের গোনাহ ক্ষমা করবেন।"],
["সূরা আলে ইমরান ৩:১০৩ (অংশ)", "وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا", "তোমরা সবাই মিলে আল্লাহর রজ্জুকে শক্ত করে ধরো এবং বিচ্ছিন্ন হয়ো না।"],
["সূরা আলে ইমরান ৩:১৩৩ (অংশ)", "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ", "তোমরা তোমাদের রবের ক্ষমা এবং জান্নাতের দিকে ছুটে যাও, যার প্রস্থ আসমান ও জমিনের সমান।"],
["সূরা আলে ইমরান ৩:২০০", "يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ", "হে মুমিনগণ! তোমরা ধৈর্য ধারণ করো, ধৈর্যে অটল থাকো, প্রস্তুত থাকো এবং আল্লাহকে ভয় করো, যাতে তোমরা সফল হও।"],
["সূরা নিসা ৪:১০৩ (অংশ)", "إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا", "নিশ্চয়ই সালাত মুমিনদের জন্য নির্ধারিত সময়ে ফরজ।"],
["সূরা মায়িদা ৫:২ (অংশ)", "وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ", "তোমরা নেকি ও তাকওয়ার কাজে একে অপরকে সহযোগিতা করো, আর পাপ ও সীমালঙ্ঘনে সহযোগিতা করো না।"],
["সূরা আনআম ৬:১৬২", "قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ", "বলুন, আমার সালাত, আমার কুরবানি, আমার জীবন ও আমার মরণ সবই সৃষ্টিজগতের রব আল্লাহর জন্য।"],
["সূরা আ'রাফ ৭:৫৬ (অংশ)", "إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ", "নিশ্চয়ই আল্লাহর রহমত সৎকর্মশীলদের নিকটে।"],
["সূরা আ'রাফ ৭:১৯৯", "خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ", "ক্ষমার পথ অবলম্বন করুন, ভালো কাজের আদেশ দিন এবং মূর্খদের এড়িয়ে চলুন।"],
["সূরা আনফাল ৮:৪৬ (অংশ)", "وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ", "আর তোমরা ধৈর্য ধরো; নিশ্চয়ই আল্লাহ ধৈর্যশীলদের সাথে আছেন।"],
["সূরা তাওবা ৯:৫১ (অংশ)", "قُل لَّن يُصِيبَنَا إِلَّا مَا كَتَبَ اللَّهُ لَنَا هُوَ مَوْلَانَا ۚ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "বলুন, আল্লাহ আমাদের জন্য যা লিখে রেখেছেন, তা ছাড়া আমাদের কিছুই স্পর্শ করবে না। তিনিই আমাদের অভিভাবক; আর মুমিনদের উচিত আল্লাহর ওপরই ভরসা করা।"],
["সূরা ইউনুস ১০:৬২", "أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "জেনে রাখো, নিশ্চয়ই আল্লাহর বন্ধুদের কোনো ভয় নেই এবং তারা দুঃখিতও হবে না।"],
["সূরা হুদ ১১:৮৮ (অংশ)", "وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ", "আমার তাওফিক কেবল আল্লাহর সাহায্যেই। আমি তাঁর ওপরই ভরসা করেছি এবং তাঁর দিকেই ফিরে যাই।"],
["সূরা ইউসুফ ১২:৮৭ (অংশ)", "وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ", "তোমরা আল্লাহর রহমত থেকে নিরাশ হয়ো না।"],
["সূরা রা'দ ১৩:১১ (অংশ)", "إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنفُسِهِمْ", "নিশ্চয়ই আল্লাহ কোনো জাতির অবস্থা পরিবর্তন করেন না, যতক্ষণ না তারা নিজেদের অবস্থা নিজেরা পরিবর্তন করে।"],
["সূরা ইবরাহিম ১৪:৭ (অংশ)", "لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ", "যদি তোমরা কৃতজ্ঞ হও, তবে আমি অবশ্যই তোমাদের (নিয়ামত) বাড়িয়ে দেব।"],
["সূরা হিজর ১৫:৯৯", "وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ", "আর আপনি আপনার রবের ইবাদত করুন, যতক্ষণ না আপনার কাছে মৃত্যু আসে।"],
["সূরা নাহল ১৬:৯০ (অংশ)", "إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ", "নিশ্চয়ই আল্লাহ ন্যায়বিচার, সদাচরণ ও আত্মীয়দের দান করার আদেশ দেন।"],
["সূরা বনি ইসরাইল ১৭:২৩ (অংশ)", "وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا", "আপনার রব আদেশ করেছেন, তোমরা তিনি ছাড়া অন্য কারও ইবাদত করো না এবং পিতা-মাতার সাথে সদ্ব্যবহার করো।"],
["সূরা বনি ইসরাইল ১৭:৮১ (অংশ)", "وَقُلْ جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ ۚ إِنَّ الْبَاطِلَ كَانَ زَهُوقًا", "বলুন, সত্য এসেছে এবং মিথ্যা বিলুপ্ত হয়েছে। নিশ্চয়ই মিথ্যা বিলুপ্ত হওয়ারই।"],
["সূরা কাহফ ১৮:৪৬ (অংশ)", "الْمَالُ وَالْبَنُونَ زِينَةُ الْحَيَاةِ الدُّنْيَا ۖ وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا", "ধন-সম্পদ ও সন্তান দুনিয়ার জীবনের সৌন্দর্য। আর স্থায়ী সৎকর্মসমূহ আপনার রবের কাছে প্রতিদানে ও আশায় উত্তম।"],
["সূরা ত্বহা ২০:১৪ (অংশ)", "إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "নিশ্চয়ই আমিই আল্লাহ, আমি ছাড়া কোনো ইলাহ নেই। অতএব আমারই ইবাদত করো এবং আমার স্মরণে সালাত কায়েম করো।"],
["সূরা ত্বহা ২০:২৫-২৬", "رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي", "হে আমার রব! আমার বক্ষ প্রশস্ত করে দিন এবং আমার কাজ সহজ করে দিন।"],
["সূরা মুমিনুন ২৩:১-২", "قَدْ أَفْلَحَ الْمُؤْمِنُونَ ۝ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ", "অবশ্যই মুমিনরা সফল হয়েছে, যারা নিজেদের সালাতে বিনয়ী।"],
["সূরা ফুরকান ২৫:৬৩ (অংশ)", "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا", "রহমানের বান্দারা তারা, যারা জমিনে বিনয়ের সাথে চলে এবং মূর্খরা তাদের সম্বোধন করলে বলে, 'সালাম'।"],
["সূরা আনকাবুত ২৯:৬৯ (অংশ)", "وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ", "যারা আমার পথে চেষ্টা-সাধনা করে, আমি অবশ্যই তাদের আমার পথ দেখাব। নিশ্চয়ই আল্লাহ সৎকর্মশীলদের সাথে আছেন।"],
["সূরা লুকমান ৩১:১৭ (অংশ)", "يَا بُنَيَّ أَقِمِ الصَّلَاةَ وَأْمُرْ بِالْمَعْرُوفِ وَانْهَ عَنِ الْمُنكَرِ وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ", "হে আমার প্রিয় বৎস! সালাত কায়েম করো, ভালো কাজের আদেশ দাও, মন্দ কাজে নিষেধ করো এবং তোমার ওপর যে বিপদ আসে তাতে ধৈর্য ধরো।"],
["সূরা আহযাব ৩৩:৪১", "يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا", "হে মুমিনগণ! তোমরা আল্লাহকে অধিক পরিমাণে স্মরণ করো।"],
["সূরা আহযাব ৩৩:৫৬", "إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا", "নিশ্চয়ই আল্লাহ ও তাঁর ফেরেশতারা নবীর ওপর দরূদ পাঠান। হে মুমিনগণ! তোমরাও তাঁর ওপর দরূদ ও সালাম পাঠাও।"],

 আহইয়ানা বাদা মা আমাতানা ওয়াইলাইহিন নুশূর", "خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ، وَأَنَا خَيْرُكُمْ لِأَهْلِي": "খাইরুকুম খাইরুকুম লিআহলিহি ওয়াআনা খাইরুকুম লিআহলী", "نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالْفَرَاغُ": "নিমাতানি মাগবূনুন ফীহিমা কাসীরুন মিনান নাস আস্সিহ্হাতু ওয়ালফারাগ", "بِسْمِ اللهِ وَلَجْنَا وَبِسْمِ اللهِ خَرَجْنَا وَعَلَى رَبِّنَا تَوَكَّلْنَا": "বিসমিল্লাহি ওয়ালাজনা ওয়াবিসমিল্লাহি খারাজনা ওয়াআলা রাব্বিনা তাওয়াক্কালন", "الْخَافِضُ": "আলখাফিদ", "الْعَدْلُ": "আল-আদল", "الْمُذِلُّ": "আলমুযিল্ল", "وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ": "ওয়াসবিরূ ইন্নাল্লাহা মাআস সাবিরীন", "وَمَن يُؤْمِن بِاللَّهِ يَهْدِ قَلْبَهُ": "ওয়ামান ইউমিন বিল্লাহি ইয়াহদি কালবাহ", "وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ": "ওয়ামা তাওফীকী ইল্লা বিল্লাহি আলাইহি তাওয়াক্কালতু ওয়াইলাইহি উনীব", "كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ": "কুন ফীদ দুনইয়া কাআন্নাকা গারীবুন আও আবিরু সাবীল", "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ": "রাব্বানা আতিনা ফীদ দুনইয়া হাসানাতান ওয়াফীল আখিরাতি হাসানাতান ওয়াকিনা আযাবান নার", "الْمُبْدِئُ": "আলমুবদি", "إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ": "ইন্নামাল মুমিনূনা ইখওয়াতুন ফাআসলিহূ বাইনা আখাওয়াইকুম ওয়াত্তাকূল্লাহা লাআল্লাকুম তুরহামূন", "وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ": "ওয়াকালা রাব্বুকুমু ইদ-ঊনী আসতাজিব লাকুম", "عَلَيْكُمْ بِالصِّدْقِ فَإِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ": "আলাইকুম বিস্সিদকি ফাইন্নাস সিদকা ইয়াহদী ইলাল বির্রি ওয়াইন্নাল বির্রা ইয়াহদী ইলাল জান্নাত", "وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ": "ওয়াইযা সাআলাকা ইবাদী আন্নী ফাইন্নী কারীবুন উজীবু দাওয়াতাদ দাই ইযা দাআন", "مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ": "মান কানা ইউমিনু বিল্লাহি ওয়ালইয়াওমিল আখিরি ফালইয়ুকর
