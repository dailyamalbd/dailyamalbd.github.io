<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমল সাথী</title>
<meta name="description" content="নামাজের সময়, আমল ট্র্যাকার, দোয়া ও কিবলা এক অ্যাপে">
<meta name="theme-color" content="#0f8a5f">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="আমল সাথী">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f4;--card:#fff;--ink:#17332b;--mut:#6b7f78;--g:#0f8a5f;--gd:#14352c;--gl:#d3efe4;--or:#f59e0b;--line:#e2eae7;--hero1:#f6e58d;--hero2:#f9c968;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#16231f;--ink:#e6f1ed;--mut:#8aa39a;--g:#2fc08a;--gd:#e6f1ed;--gl:#1f3a31;--line:#243630;--hero1:#3b3a1c;--hero2:#4a3a14}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231f;--ink:#e6f1ed;--mut:#8aa39a;--g:#2fc08a;--gd:#e6f1ed;--gl:#1f3a31;--line:#243630;--hero1:#3b3a1c;--hero2:#4a3a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
main{flex:1;overflow-y:auto;padding-bottom:12px}
.hero{background:linear-gradient(170deg,var(--hero1),var(--hero2));padding:16px 20px 74px;border-radius:0 0 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;font-weight:500;line-height:1.5}
.top small{display:block;color:var(--mut);font-size:13px}
.dial{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.dial svg{width:230px;height:130px}
.dial .nm{font-size:28px;font-weight:700;margin-top:-72px;line-height:1.3;position:relative;z-index:1}
.dial .sub{font-size:14px;color:var(--mut)}
.dial .cd{font-size:34px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;justify-content:center;margin-top:12px;font-size:13px;flex-wrap:wrap}
.chip{background:rgba(20,53,44,.12);border-radius:99px;padding:6px 12px}
.sheet{background:var(--card);margin-top:-52px;border-radius:22px 22px 0 0;padding:6px 0 0;position:relative}
.pr{display:flex;align-items:center;padding:13px 20px;gap:14px}
.pr .n{flex:1;font-size:17px}
.pr .t{color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums}
.pr.now .n{font-weight:700}.pr.now .t{color:var(--ink);font-weight:600}
.pr:not(.now) .n{color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--or)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;padding:0;color:#fff;font-size:15px;cursor:pointer}
.ck.on{background:var(--g);border-color:var(--g)}
.card{background:var(--card);margin:12px 0;padding:16px 20px}
.sum{display:flex;align-items:center;justify-content:space-between}
.sum b{color:var(--g)}
.big{font-size:26px;font-weight:700;line-height:1.3;margin:12px 0 4px}
.mut{color:var(--mut);font-size:15px}
.sd{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;margin:12px 20px}
.sd b{display:block;font-size:16px}
.week{display:flex;justify-content:space-around;background:var(--card);padding:14px 4px 12px;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
.d{text-align:center;font-size:13px;color:var(--mut);cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.d i{display:grid;place-items:center;width:46px;height:46px;margin-top:6px;font-style:normal;font-size:17px;color:var(--ink);position:relative;border-radius:50%}
.d.sel{color:var(--g);font-weight:600}.d.sel i{background:var(--g);color:#fff}
.d svg{position:absolute;inset:0}
.hd{display:flex;justify-content:space-between;align-items:center;padding:6px 0;cursor:pointer;background:none;border:0;width:100%;font-family:inherit;color:inherit;text-align:left}
.hd h3{margin:0;font-size:19px}
.bar{height:5px;background:var(--gl);border-radius:9px;width:70%;margin:8px 0 2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--g);transition:width .3s}
.itm{display:flex;align-items:center;gap:14px;padding:12px 0;font-size:17px}
.itm span{flex:1}
.ico{width:42px;height:42px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-size:20px}
.chev{transition:transform .2s;color:var(--mut)}.open .chev{transform:rotate(180deg)}
.body{display:none}.open .body{display:block}
.dua{border-bottom:1px solid var(--line);padding:14px 0}
.dua h4{margin:0 0 6px;font-size:16px}
.ar{font-size:22px;direction:rtl;font-family:"Noto Naskh Arabic","Amiri",serif;line-height:1.9;margin:4px 0}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;font-family:inherit;color:var(--mut);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:0}
nav button b{font-size:22px;font-weight:400;padding:4px 14px;border-radius:99px}
nav button.on{color:var(--g);font-weight:600}nav button.on b{background:var(--gl)}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
select,.btn{font-family:inherit;font-size:15px;background:var(--gl);color:var(--ink);border:0;border-radius:10px;padding:8px 12px}
.sel-city{background:rgba(20,53,44,.12);border:0;border-radius:99px;padding:6px 10px;font-family:inherit;font-size:13px;color:inherit}
.ban{position:sticky;top:0;z-index:6;display:flex;gap:12px;align-items:center;background:#fdecec;color:#8f1d1d;padding:12px 16px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ban .bi{background:#dc2626;color:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;font-size:22px;flex:none}
.ban b{font-size:18px;display:block}.ban button{background:none;border:0;font-size:22px;color:#b91c1c;cursor:pointer}
.gl{display:flex;justify-content:space-between;margin:14px 0}
.g{background:none;border:0;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;cursor:pointer;padding:0;width:64px}
.g .rg{position:relative;width:60px;height:60px;display:grid;place-items:center;font-size:22px}.g .rg svg{position:absolute;inset:0}
.g small{color:var(--mut);font-size:13px}
.go{display:block;text-align:center;background:var(--g);color:#fff;text-decoration:none;border-radius:99px;padding:14px;font-size:18px;font-weight:500}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 2px;margin-top:14px}
.fi{background:none;border:0;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;text-decoration:none;cursor:pointer;padding:0}
.fi i{width:62px;height:62px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-size:26px;font-style:normal}
.fi.soon{opacity:.5}
.lnk{background:none;border:0;color:var(--g);font-family:inherit;font-size:16px;cursor:pointer}
.fb h3{color:#991b1b}.fbr{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.cmp{display:grid;place-items:center;margin:18px 0}
.cmp .c{position:relative;width:240px;height:240px;border-radius:50%;border:3px solid var(--g);background:var(--gl)}
.cmp #nd{position:absolute;inset:0;transition:transform .15s}
.cmp #nd:before{content:"";position:absolute;left:50%;top:18px;bottom:50%;width:4px;margin-left:-2px;background:var(--g);border-radius:4px}
.cmp #nd b{position:absolute;left:50%;top:-6px;margin-left:-16px;font-size:28px}
.tap{width:200px;height:200px;border-radius:50%;border:0;background:var(--g);color:#fff;font-family:inherit;margin:18px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.tap b{font-size:64px;line-height:1}.tap small{font-size:18px;opacity:.85}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<script>
// ---------- helpers ----------
var BN="০১২৩৪৫৬৭৮৯";
function bn(s){return String(s).replace(/\d/g,function(d){return BN[d]})}
function pad(n){return n<10?"0"+n:""+n}
function store(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var D2R=Math.PI/180;
function sin(a){return Math.sin(a*D2R)}function cos(a){return Math.cos(a*D2R)}function tan(a){return Math.tan(a*D2R)}
function asin(x){return Math.asin(x)/D2R}function acos(x){return Math.acos(x)/D2R}function atan2(y,x){return Math.atan2(y,x)/D2R}
function fa(a){a=a-360*Math.floor(a/360);return a}
function fh(h){return h-24*Math.floor(h/24)}

// ---------- cities (lat, lon, UTC offset hours) ----------
var CITIES={"ঢাকা":[23.8103,90.4125],"চট্টগ্রাম":[22.3569,91.7832],"রাজশাহী":[24.3745,88.6042],"খুলনা":[22.8456,89.5403],"সিলেট":[24.8949,91.8687],"বরিশাল":[22.701,90.3535],"রংপুর":[25.7439,89.2752],"ময়মনসিংহ":[24.7471,90.4203]};
var TZ=6;

// ---------- prayer time calculation (Karachi 18/18, Hanafi Asr) ----------
function sun(jd){var d=jd-2451545,g=fa(357.529+.98560028*d),q=fa(280.459+.98564736*d),L=fa(q+1.915*sin(g)+.02*sin(2*g)),e=23.439-3.6e-7*d;
  var ra=fh(atan2(cos(e)*sin(L),cos(L))/15);return{decl:asin(sin(e)*sin(L)),eq:q/15-ra}}
function jdOf(y,m,d){if(m<=2){y--;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function times(y,m,d,lat,lon){
  var s=sun(jdOf(y,m,d)+0.5-TZ/24+ (12-TZ)/24*0 ), noon=fh(12+TZ-lon/15-s.eq);
  function at(ang,ccw){var v=acos((-sin(ang)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15;return noon+(ccw?-v:v)}
  var asrAng=-Math.atan(1/(2+tan(Math.abs(lat-s.decl))))/D2R;
  return{fajr:at(18,1),sunrise:at(.833,1),dhuhr:noon+2/60,asr:at(asrAng,0),sunset:at(.833,0),maghrib:at(.833,0)+1/60,isha:at(18,0)}}
function hm(h){h=fh(h);var m=Math.round(h*60)%1440,hh=Math.floor(m/60);return pad(hh%12===0?12:hh%12)+":"+pad(m%60)}

// ---------- dates ----------
var WD=["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
var WS=["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"];
var EM=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
var HM=["মুহাররম","সফর","রবিউল আউয়াল","রবিউস সানি","জুমাদাল উলা","জুমাদাল আখিরাহ","রজব","শাবান","রমজান","শাওয়াল","জিলকদ","জিলহজ"];
var BM=["বৈশাখ","জ্যৈষ্ঠ","আষাঢ়","শ্রাবণ","ভাদ্র","আশ্বিন","কার্তিক","অগ্রহায়ণ","পৌষ","মাঘ","ফাল্গুন","চৈত্র"];
var BS=[[4,14],[5,15],[6,15],[7,16],[8,16],[9,16],[10,16],[11,16],[12,16],[1,14],[2,13],[3,15]]; // month start (gregorian month, day)
BS[6]=[10,17];
function bnDate(y,m,d){var t=m*100+d,idx=-1,k;
  var order=[[1,14,9],[2,13,10],[3,15,11],[4,14,0],[5,15,1],[6,15,2],[7,16,3],[8,16,4],[9,16,5],[10,17,6],[11,16,7],[12,16,8]];
  for(k=0;k<order.length;k++){if(t>=order[k][0]*100+order[k][1])idx=k}
  var o=order[idx<0?order.length-1:idx];var sm=o[0],sd=o[1],yy=y;
  if(idx<0){sm=12;sd=16;yy=y-1}
  var a=Date.UTC(yy,sm-1,sd),b=Date.UTC(y,m-1,d);
  var year=(m*100+d>=414)?y-593:y-594;
  return{day:Math.round((b-a)/864e5)+1,month:BM[o[2]],year:year}}
function hijri(date){try{var p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric",timeZone:"UTC"}).formatToParts(date),r={};
  p.forEach(function(x){r[x.type]=parseInt(x.value,10)});var adj=HA();
  var dd=r.day+adj,mm=r.month;if(dd<1){dd+=30;mm--}if(dd>30){dd-=30;mm++}return{d:dd,m:HM[(mm+11)%12],y:r.year}}catch(e){return null}}
function HA(){var v=store("hadj");return v===null?-1:v}
function dnow(){var n=new Date(Date.now()+TZ*36e5);return n}
function key(dt){return dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate())}

// ---------- amal data ----------
var CATS=[
 {id:"fard",t:"ফরজ নামাজ সমূহ",ic:"🕌",it:["ফজর","যোহর / জুমআ","আসর","মাগরিব","ইশা"]},
 {id:"nafl",t:"নফল নামাজ সমূহ",ic:"🕌",it:["দুহা (ইশরাক ও চাশত)","তাহাজ্জুদ"]},
 {id:"quran",t:"কুরআন ও দ্বীনী ইলম",ic:"📖",it:["কুরআন তিলাওয়াত","কুরআনের অর্থ ও তাফসির পাঠ","হাদিস পাঠ"]},
 {id:"dua",t:"হেফাজতের দুআ",ic:"🤲",it:["সকালের জিকির","সন্ধ্যার জিকির","আয়াতুল কুরসি","তিন কুল","ঘুমের আগের দুআ"]},
 {id:"self",t:"আত্ম উন্নয়ন",ic:"🌱",it:["ইস্তিগফার (১০০ বার)","সাদাকা","দিনের হিসাব (মুহাসাবা)"]}
];
var TOTAL=18;
var S={tab:"home",day:key(dnow()),open:{nafl:1},city:store("city")||"ঢাকা"};
function dayData(k){return store("d_"+k)||{}}
function isOn(k,id){return !!dayData(k)[id]}
function toggle(k,id){var d=dayData(k);d[id]=!d[id];store("d_"+k,d)}
function count(k,cid){var c=0;CATS.forEach(function(x){if(cid&&x.id!==cid)return;x.it.forEach(function(_,i){if(isOn(k,x.id+i))c++})});return c}

// ---------- render ----------
var ARCS=function(p,size,w){var r=size/2-w,c=2*Math.PI*r;return '<svg viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#f59e0b33" stroke-width="'+w+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#f59e0b" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+c*p+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'};
function prayerState(){
  var n=dnow(),c=CITIES[S.city],y=n.getUTCFullYear(),m=n.getUTCMonth()+1,d=n.getUTCDate();
  var t=times(y,m,d,c[0],c[1]),nowH=n.getUTCHours()+n.getUTCMinutes()/60+n.getUTCSeconds()/3600;
  var fri=n.getUTCDay()===5;
  var tm=times(y,m,d+1>28?d:d,c[0],c[1]);var nextFajr=t.fajr+24;
  var list=[
   {n:"ফজর",s:t.fajr,e:t.sunrise},
   {n:fri?"জুমআ":"যোহর",s:t.dhuhr,e:t.asr},
   {n:"আসর",s:t.asr,e:t.sunset},
   {n:"মাগরিব",s:t.maghrib,e:t.isha},
   {n:"ইশা",s:t.isha,e:nextFajr}];
  var cur=-1,i;
  for(i=0;i<5;i++){if(nowH>=list[i].s&&nowH<list[i].e)cur=i}
  if(nowH<t.fajr){cur=4;list[4]={n:"ইশা",s:t.isha-24,e:t.fajr};}
  var info;
  if(cur>=0)info={name:list[cur].n,left:list[cur].e-nowH,span:list[cur].e-list[cur].s};
  else{var nx=nowH<t.dhuhr?{n:"যোহর",s:t.dhuhr}:{n:"মাগরিব",s:t.maghrib};if(nowH>=t.sunrise&&nowH<t.dhuhr)nx={n:"যোহর",s:t.dhuhr};info={name:nx.n,left:nx.s-nowH,span:3,wait:true}}
  return{t:t,list:list,cur:cur,info:info,fri:fri}}
function cdStr(h){var s=Math.max(0,Math.round(h*3600));return bn(pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60))}

function home(){
  var n=dnow(),ps=prayerState(),k=key(n),c=count(k);
  var h=hijri(n),b=bnDate(n.getUTCFullYear(),n.getUTCMonth()+1,n.getUTCDate());
  var frac=Math.min(1,Math.max(0,1-ps.info.left/ps.info.span)),r=90,len=Math.PI*r;
  var html=banner(ps)+'<div class="hero"><div class="top"><div>'+WD[n.getUTCDay()]+(h?'<small>'+bn(h.d)+' '+h.m+', '+bn(h.y)+' হিজরি</small>':'')+'<small>'+bn(n.getUTCDate())+' '+EM[n.getUTCMonth()]+', '+bn(b.day)+' '+b.month+'</small></div></div>';
  html+='<div class="dial"><svg viewBox="0 0 230 130"><path d="M25 115 A90 90 0 0 1 205 115" fill="none" stroke="rgba(20,53,44,.15)" stroke-width="12" stroke-linecap="round"/><path id="arc" d="M25 115 A90 90 0 0 1 205 115" fill="none" stroke="#14352c" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+len*frac+' '+len+'"/></svg>';
  html+='<div class="nm">'+ps.info.name+'</div><div class="sub">'+(ps.info.wait?'শুরু হতে বাকি':'শেষ হতে বাকি')+'</div><div class="cd" id="cd">'+cdStr(ps.info.left)+'</div>';
  html+='<div class="chips"><select class="sel-city" id="city">'+Object.keys(CITIES).map(function(x){return '<option'+(x===S.city?' selected':'')+'>'+x+'</option>'}).join('')+'</select><span class="chip">সূর্যোদয়: '+bn(hm(ps.t.sunrise))+'</span><span class="chip">সূর্যাস্ত: '+bn(hm(ps.t.sunset))+'</span></div></div></div>';
  html+='<div class="sheet">';
  ps.list.forEach(function(p,i){var on=isOn(k,"fard"+i);

function qsurah(p){var n=parseInt(store("qsurn"),10),r=QS[0],f=null;QS.forEach(function(s){if(s[2]<=p)r=s;if(s[0]===n&&s[2]===p)f=s});return f||r}
function qcur(){var p=parseInt(store("qpage"),10);if(!(p>=1))p=2;return Math.max(1,Math.min(QN,p))}
function qpack(k){
  if(Q.packs[k])return Promise.resolve(Q.packs[k]);
  if(Q.wait[k])return Q.wait[k];
  Q.wait[k]=fetch("quran-"+pad(k)+".bin").then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(buf){
    var dv=new DataView(buf),n=dv.getUint32(0,true),off=4+4*n,u=[],i,len;
    for(i=0;i<n;i++){len=dv.getUint32(4+4*i,true);u.push(URL.createObjectURL(new Blob([buf.slice(off,off+len)],{type:"image/webp"})));off+=len}
    Q.packs[k]=u;delete Q.wait[k];return u}).catch(function(e){delete Q.wait[k];throw e});
  return Q.wait[k]}
function qclean(k){Object.keys(Q.packs).forEach(function(x){if(Math.abs(x-k)>1){Q.packs[x].forEach(function(u){URL.revokeObjectURL(u)});delete Q.packs[x]}})}
function qpost(){
  var p=qcur(),k=Math.floor((p-1)/QPER),i=(p-1)%QPER,im=document.getElementById("qimg"),st=document.getElementById("qst"),np=Math.ceil(QN/QPER);
  if(!im)return;
  qpack(k).then(function(u){
    if(qcur()!==p||!document.getElementById("qimg"))return;
    document.getElementById("qimg").src=u[i];if(st)st.textContent="";
    if(i>=QPER-6&&k+1<np)qpack(k+1).catch(function(){});
    if(i<5&&k>0)qpack(k-1).catch(function(){});
    qclean(k)}).catch(function(){if(st)st.textContent="পৃষ্ঠাটি লোড হয়নি। ইন্টারনেট চালু করে আবার চেষ্টা করুন। একবার খোলা পৃষ্ঠা অফলাইনেও খোলে।"})}
function qgo(p){p=Math.max(1,Math.min(QN,p));store("qpage",p);render();document.getElementById("main").scrollTop=0}
function qact(a){
  var p=qcur();
  if(a==="next"){if(p<QN)qgo(p+1);return}
  if(a==="prev"){if(p>1)qgo(p-1);return}
  if(a==="zoom"){Q.zoom=(Q.zoom+1)%3;render();return}
  if(a==="go"){var v=parseInt(qen(document.getElementById("qnum").value),10);if(v>=1&&v<=QN)qgo(v);else{var s=document.getElementById("qst");if(s)s.textContent="১ থেকে "+bn(QN)+" এর মধ্যে পৃষ্ঠা নম্বর লিখুন।"}return}
  if(a==="dl"){var np=Math.ceil(QN/QPER),k=0,m=document.getElementById("qdl");
    var step=function(){if(k>=np){if(m)m.textContent="সব পৃষ্ঠা ফোনে সেভ হয়েছে। এখন ইন্টারনেট ছাড়াই পড়া যাবে।";store("qoff",1);return}
      if(m)m.textContent="সেভ হচ্ছে… "+bn(k)+"/"+bn(np);
      fetch("quran-"+pad(k)+".bin").then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(){k++;step()}).catch(function(){if(m)m.textContent="সেভ করা যায়নি। ইন্টারনেট ঠিক আছে কিনা দেখে আবার চেষ্টা করুন।"})};
    step()}}
function quranView(){
  var p=qcur(),pr=qparah(p),sr=qsurah(p),z=[100,160,230][Q.zoom];
  var po="",i;for(i=1;i<=30;i++)po+='<option value="'+QPS[i-1]+'"'+(i===pr?" selected":"")+'>পারা '+bn(i)+'</option>';
  var so=QS.map(function(s,j){return '<option value="'+j+'"'+(s[0]===sr[0]?" selected":"")+'>'+(s[0]>0?bn(s[0])+'. ':'')+s[1]+'</option>'}).join("");
  var inp='width:64px;font-family:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center';
  return back()+'<div class="card" style="margin-top:0;padding-bottom:12px"><h3 style="margin:0 0 2px;font-size:20px">কুরআন শরীফ</h3><div class="mut" style="margin-bottom:10px">নূরানী হাফেজী, এমদাদিয়া লাইব্রেরী</div>'+
  '<div style="display:flex;gap:8px"><select id="qsur" style="flex:3;min-width:0">'+so+'</select><select id="qpar" style="flex:2;min-width:0">'+po+'</select></div>'+
  '<div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="btn" data-qa="prev"'+(p<=1?" disabled":"")+' aria-label="আগের পৃষ্ঠা">←</button><input id="qnum" inputmode="numeric" aria-label="পৃষ্ঠা নম্বর" value="'+bn(p)+'" style="'+inp+'"><button class="btn" data-qa="go">যান</button><button class="btn" data-qa="next"'+(p>=QN?" disabled":"")+' aria-label="পরের পৃষ্ঠা">→</button><span class="mut" style="flex:1;text-align:right;font-size:13px">পৃষ্ঠা '+bn(p)+' / '+bn(QN)+'</span></div></div>'+
  '<div id="qwrap" style="overflow:auto;background:#fff;margin:0 8px;border-radius:10px;border:1px solid var(--line);min-height:240px;touch-action:'+(Q.zoom?'auto':'pan-y')+'"><img id="qimg" alt="কুরআনের পৃষ্ঠা '+bn(p)+'" draggable="false" style="display:block;width:'+z+'%;height:auto"></div>'+
  '<div id="qst" class="mut" style="margin:8px 20px;text-align:center"></div>'+
  '<div style="display:flex;gap:8px;margin:8px 20px"><button class="btn" data-qa="prev" style="flex:1"'+(p<=1?" disabled":"")+'>← আগের</button><button class="btn" data-qa="zoom" style="flex:1">🔍 '+bn(z)+'%</button><button class="btn" data-qa="next" style="flex:1"'+(p>=QN?" disabled":"")+'>পরের →</button></div>'+
  '<div class="mut" style="margin:4px 20px 0;text-align:center;font-size:13px">ডানে সোয়াইপ করলে পরের পৃষ্ঠা, বামে সোয়াইপ করলে আগের পৃষ্ঠা</div>'+
  '<div class="card"><button class="btn" data-qa="dl" style="width:100%">অফলাইনের জন্য সব পৃষ্ঠা ফোনে সেভ করুন</button><div id="qdl" class="mut" style="margin-top:8px;text-align:center;font-size:14px">'+(store("qoff")?"আগে একবার সেভ করা হয়েছে।":"প্রায় "+bn(Math.round(QN*0.04))+" MB ডেটা লাগবে। Wi-Fi-তে করা ভালো।")+'</div></div>'}
var qtx=null;
document.addEventListener("touchstart",function(e){var w=e.target.closest&&e.target.closest("#qwrap");qtx=(w&&Q.zoom===0)?[e.touches[0].clientX,e.touches[0].clientY]:null},{passive:true});
document.addEventListener("touchend",function(e){if(!qtx)return;var t=e.changedTouches[0],dx=t.clientX-qtx[0],dy=t.clientY-qtx[1];qtx=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)qact(dx>0?"next":"prev")},{passive:true});
function feat(){if(S.sub==="quran")return quranView();if(S.sub==="qibla")return qibla();if(S.sub==="tasbih")return tasbih();if(S.sub==="ruq")return ruq();
  return '<div class="card" style="margin-top:0"><h3 style="margin:0;font-size:20px">ফিচার্স</h3>'+featGrid()+'</div>'+forbSec(prayerState())}
function fbWin(ps){var t=ps.t;return [[t.sunrise,t.sunrise+.25,"সূর্যোদয়ের সময়"],[t.dhuhr-.14,t.dhuhr,"ঠিক দুপুর (যাওয়াল)"],[t.sunset-.25,t.sunset,"সূর্যাস্তের সময়"]]}
function fbNow(ps){var n=dnow(),h=n.getUTCHours()+n.getUTCMinutes()/60,w=fbWin(ps);for(var i=0;i<3;i++)if(h>=w[i][0]&&h<w[i][1])return i;return -1}
function banner(ps){var i=fbNow(ps);S.fbs=i;if(i<0||S.bd===i)return"";return '<div class="ban"><div class="bi">⚠</div><div style="flex:1"><b>সালাতের নিষিদ্ধ সময়</b><div>এ সময়ে সালাত আদায় করা নিষিদ্ধ</div></div><button data-x="1" aria-label="বন্ধ করুন">✕</button></div>'}
function forbSec(ps){return '<div class="card fb"><h3 style="margin:0 0 6px;font-size:19px">সালাতের নিষিদ্ধ সময়</h3>'+fbWin(ps).map(function(w){return '<div class="fbr"><span>'+w[2]+'</span><span class="mut">'+bn(hm(w[0]))+' - '+bn(hm(w[1]))+'</span></div>'}).join('')+'<p class="mut">সময়গুলো আনুমানিক। মাসআলার বিস্তারিত জানতে আলেমের পরামর্শ নিন।</p></div>'}

["সাইয়্যিদুল ইস্তেগফার","اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","হে আল্লাহ, আপনি আমার রব, আপনি ছাড়া কোনো ইলাহ নেই। আপনি আমাকে সৃষ্টি করেছেন, আমি আপনার বান্দা। আমি যথাসাধ্য আপনার অঙ্গীকার ও প্রতিশ্রুতির ওপর আছি। আমি যা করেছি তার অনিষ্ট থেকে আপনার আশ্রয় চাই। আমার ওপর আপনার নিয়ামত স্বীকার করছি এবং আমার গুনাহও স্বীকার করছি। তাই আমাকে ক্ষমা করুন, কারণ আপনি ছাড়া কেউ গুনাহ ক্ষমা করতে পারে না। (সকাল ও সন্ধ্যায় পড়ার কথা হাদিসে এসেছে।)"],
["ইউনুস (আ.)-এর দোয়া","لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ","আপনি ছাড়া কোনো ইলাহ নেই, আপনি পবিত্র। নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম।"],
["আদম (আ.)-এর দোয়া","رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","হে আমাদের রব, আমরা নিজেদের ওপর জুলুম করেছি। আপনি ক্ষমা না করলে ও দয়া না করলে আমরা অবশ্যই ক্ষতিগ্রস্তদের অন্তর্ভুক্ত হব।"]];
function isel(){return S.ii!==undefined?S.ii:0}
function ichips(){var g=gd(key(dnow()));return '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px">'+ISS.map(function(z,i){var on=i===isel(),c=g["i"+i]||0;return '<button data-ii="'+i+'" style="font-family:inherit;font-size:15px;border-radius:99px;padding:8px 14px;cursor:pointer;text-align:left;border:1.5px solid var(--g);background:'+(on?'var(--g)':'transparent')+';color:'+(on?'#fff':'var(--ink)')+'">'+z[0]+(c?' · '+bn(c):'')+'</button>'}).join('')+'</div>'}
function dsel(){return S.di!==undefined?S.di:0}
function dchips(){var g=gd(key(dnow()));return '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px">'+DRS.map(function(z,i){var on=i===dsel(),c=g["d"+i]||0;return '<button data-di="'+i+'" style="font-family:inherit;font-size:15px;border-radius:99px;padding:8px 14px;cursor:pointer;text-align:left;border:1.5px solid var(--g);background:'+(on?'var(--g)':'transparent')+';color:'+(on?'#fff':'var(--ink)')+'">'+z[0]+(c?' · '+bn(c):'')+'</button>'}).join('')+'</div>'}
function zsel(){return S.zi!==undefined?S.zi:Math.floor(dnow().getTime()/864e5)%4}
function zchips(){var g=gd(key(dnow()));return '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px">'+ZK.map(function(z,i){var on=i===zsel(),c=g["z"+i]||0;return '<button data-zi="'+i+'" style="font-family:inherit;font-size:15px;border-radius:99px;padding:8px 14px;cursor:pointer;border:1.5px solid var(--g);background:'+(on?'var(--g)':'transparent')+';color:'+(on?'#fff':'var(--ink)')+'">'+z[0]+(c?' · '+bn(c):'')+'</button>'}).join('')+'</div>'}
function goalView(){var id=S.goal,x=GO.filter(function(a){return a[0]===id})[0],k=key(dnow()),v=(id==="z"?(gd(k)["z"+zsel()]||0):id==="d"?(gd(k)["d"+dsel()]||0):id==="i"?(gd(k)["i"+isel()]||0):(gd(k)[id]||0)),done=v>=x[2],cnt=x[2]>1&&id!=="q";
  var h='<button class="btn" data-gb="1" style="margin:12px 20px">← ফিরে যান</button><div class="card" style="margin-top:0"><div class="sum"><h3 style="margin:0;font-size:21px">'+x[3]+' '+x[1]+'</h3><b>'+bn(v)+'/'+bn(x[2])+'</b></div>';
  if(id==="q")h+='<div class="mut" style="margin-top:6px">আজকের ৫টি আয়াত (প্রতিদিন নতুন)</div>'+pick(VERSES,5).map(function(a){return '<div class="dua"><div class="mut">'+a[0]+'</div><div class="ar">'+a[1]+'</div><div style="line-height:1.6">'+a[2]+'</div></div>'}).join('');
  else if(id==="h"){var a=pick(HAD,1)[0];h+='<div class="mut" style="margin-top:6px">আজকের হাদিস (ভাবানুবাদ)</div><div class="dua"><div class="ar">'+a[2]+'</div><div style="font-size:20px;line-height:1.6">'+a[0]+'</div><div class="mut" style="margin-top:6px">সূত্র: '+a[1]+'</div></div>'}
  else{var a=id==="d"?DRS[dsel()]:id==="i"?ISS[isel()]:ZK[zsel()];h+=(id==="z"?'<div class="mut" style="margin-top:6px">নিজের পছন্দমতো যেকোনো যিকির বেছে নিন (ঐচ্ছিক)</div>'+zchips():id==="d"?'<div class="mut" style="margin-top:6px">নিজের পছন্দমতো যেকোনো দরূদ বেছে নিন (ঐচ্ছিক)</div>'+dchips():id==="i"?'<div class="mut" style="margin-top:6px">নিজের পছন্দমতো যেকোনো ইস্তেগফার বেছে নিন (ঐচ্ছিক)</div>'+ichips():'')+'<div class="mut" style="margin-top:10px">'+(id==="z"||id==="d"||id==="i"?'':'আজকের '+x[1]+': ')+bn(x[2])+' বার</div><div class="dua"><h4>'+a[0]+'</h4><div class="ar">'+a[1]+'</div><div style="line-height:1.6">'+a[2]+'</div></div>'}
  if(cnt)h+='<button class="btn" data-gc="1" style="width:100%;margin-top:12px;font-size:17px">+১ গণনা</button>';
  h+='<button class="go" data-gd="1" style="border:0;width:100%;font-family:inherit;cursor:pointer;margin-top:12px">'+(done?'✓ পড়েছি':'পড়েছি')+'</button></div>';
  return h}
function applyTheme(){var t=store("theme")||"auto",r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t)}
var TABS=[["home","🏠","হোম"],["amal","✅","আমল"],["feat","🧰","ফিচার্স"],["dua","🤲","দোয়া"],["more","☰","অন্যান্য"]];
function render(){
  var m=document.getElementById("main"),sc=m.scrollTop;
  m.innerHTML=S.tab==="home"?(S.goal?goalView():home()):S.tab==="amal"?amal():S.tab==="dua"?duaTab():S.tab==="feat"?feat():more();
  document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-tab="'+t[0]+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('');
  m.scrollTop=sc;if(S.tab==="feat"&&S.sub==="quran")qpost()}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.qa){qact(b.dataset.qa);return}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.sub="";S.goal=null;render();return}
  if(b.dataset.t){toggle(S.tab==="home"?key(dnow()):S.day,b.dataset.t);render();return}
  if(b.dataset.d){S.day=b.dataset.d;render();return}
  if(b.dataset.o){S.open[b.dataset.o]=!S.open[b.dataset.o];render();return}
  if(b.dataset.x){S.bd=S.fbs;render();return}
  if(b.dataset.sub!==undefined){S.tab="feat";S.goal=null;S.sub=b.dataset.sub;render();return}
  if(b.dataset.g){S.goal=b.dataset.g;render();document.getElementById("main").scrollTop=0;return}
  if(b.dataset.ii!==undefined){S.ii=+b.dataset.ii;render();return}
  if(b.dataset.di!==undefined){S.di=+b.dataset.di;render();return}
  if(b.dataset.zi!==undefined){S.zi=+b.dataset.zi;render();return}
  if(b.dataset.gb){S.goal=null;render();return}
  if(b.dataset.gc||b.dataset.gd){var kk=key(dnow()),gg=gd(kk),gi=S.goal,tg=GO.filter(function(x){return x[0]===gi})[0][2];var ck=gi==="z"?"z"+zsel():gi==="d"?"d"+dsel():gi==="i"?"i"+isel():gi;if(b.dataset.gc)gg[ck]=Math.min(tg,(gg[ck]||0)+1);else gg[ck]=(gg[ck]||0)>=tg?0:tg;if(gi==="i"){var mx=0;for(var q=0;q<7;q++)mx=Math.max(mx,gg["i"+q]||0);gg.i=mx}if(gi==="d")gg.d=Math.max(gg.d0||0,gg.d1||0,gg.d2||0,gg.d3||0,gg.d4||0);if(gi==="z")gg.z=Math.max(gg.z0||0,gg.z1||0,gg.z2||0,gg.z3||0);store("g_"+kk,gg);render();return}
  if(b.dataset.tsb!==undefined){var t=store("tsb")||{c:0,r:0};if(b.dataset.tsb==="1"){t.c++;if(t.c>=33){t.c=0;t.r++;try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}}}else t={c:0,r:0};store("tsb",t);render();return}
  if(b.id==="cmp"){var on=function(e){var h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);if(h===null)return;var nd=document.getElementById("nd");if(nd)nd.style.transform="rotate("+(S.qb-h)+"deg)"};
    var go=function(){window.addEventListener("ondeviceorientationabsolute" in window?"deviceorientationabsolute":"deviceorientation",on,true);var m=document.getElementById("cmsg");if(m)m.textContent="কম্পাস চালু। ফোন সমতল ধরে ধীরে ঘুরুন।"};
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){DeviceOrientationEvent.requestPermission().then(function(r){if(r==="granted")go()}).catch(function(){})}else go();return}
  if(b.id==="hm"){store("hadj",HA()-1);render()}
  if(b.id==="hp"){store("hadj",HA()+1);render()}});
document.addEventListener("change",function(e){
  if(e.target.id==="qpar"){qgo(parseInt(e.target.value,10));return}
  if(e.target.id==="qsur"){var s=QS[parseInt(e.target.value,10)];store("qsurn",s[0]);qgo(s[2]);return}
  if(e.target.id==="qnum"){qact("go");return}
  if(e.target.id==="city"||e.target.id==="city2"){S.city=e.target.value;store("city",S.city);render()}
  if(e.target.id==="theme"){store("theme",e.target.value);applyTheme()}});
setInterval(function(){if(S.tab!=="home")return;var ps=prayerState(),c=document.getElementById("cd");if(!c){return}
  c.textContent=cdStr(ps.info.left);if(ps.info.left<=0.0003||fbNow(ps)!==S.fbs)render()},1000);
applyTheme();render();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}
